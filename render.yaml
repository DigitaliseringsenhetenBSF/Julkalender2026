# Render Blueprint – PROPOSAL, not yet applied. Creating these services needs the campaign
# owner's approval (docs/TASKS.md). This describes the *staging* environment: dev sign-in and
# date simulation are allowed there, never in production (the server refuses to start).
services:
  - type: web
    name: miljojulkalendern-staging
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: npm ci && npm run build
    # Migrations and the idempotent content seed run on every start (src/api/bootstrap.ts).
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: APP_ENV
        value: staging
      - key: AUTH_MODE
        value: dev
      - key: DATABASE_URL
        fromDatabase:
          name: miljojulkalendern-staging-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      # Uncomment to test a given day in staging, e.g. the unlock moment.
      # - key: FAKE_TODAY
      #   value: '2026-12-10'

databases:
  - name: miljojulkalendern-staging-db
    region: frankfurt
    # Free Render databases expire after 30 days (unverified); the campaign needs a paid plan.
    plan: basic-256mb
    postgresMajorVersion: '17'
    ipAllowList: [] # only reachable from Render services
