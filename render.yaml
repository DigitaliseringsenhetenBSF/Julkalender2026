# Render Blueprint for the calendar behind Verktygsportalen (SPEC §8, decision 2026-11-04).
# Created by the portal's owner in the Render dashboard, in the portal's workspace; the portal's
# web service then gets JULKALENDER_URL (this service's internal address) and JULKALENDER_KEY
# (the same value as PORTAL_KEY). The calendar is temporary: service and database are deleted in
# early January 2027.
#
# A private service: no public address, reached only by the portal over Render's private
# network. Date simulation, demo data and the dev sign-in are refused in production (the server
# refuses to start); a staging copy with AUTH_MODE=dev would be a second service of its own.
services:
  - type: pserv
    name: miljojulkalendern
    runtime: node
    region: frankfurt
    plan: starter
    # BASE_PATH is read by the build (Vite's base) and by the server, so it must be set before
    # the first build; the env var below covers both.
    buildCommand: npm ci && npm run build
    # Migrations and the idempotent content seed run on every start (src/api/bootstrap.ts).
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: APP_ENV
        value: production
      - key: AUTH_MODE
        value: portal
      - key: BASE_PATH
        value: /julkalender
      - key: DATABASE_URL
        fromDatabase:
          name: miljojulkalendern-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      # Generated once (openssl rand -hex 32) and pasted here and as JULKALENDER_KEY on the
      # portal's web service. Never written down anywhere else.
      - key: PORTAL_KEY
        sync: false

databases:
  - name: miljojulkalendern-db
    region: frankfurt
    plan: basic-256mb
    postgresMajorVersion: '17'
    ipAllowList: [] # only reachable from Render services
